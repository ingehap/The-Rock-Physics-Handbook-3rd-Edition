name: CI

on:
  push:
    branches: [master]
    paths: ["pyRPHtools/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["pyRPHtools/**", ".github/workflows/ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # [plot] as well as [dev], so the plotting tests actually run
        # instead of skipping on a missing matplotlib.
        run: pip install "./pyRPHtools[dev,plot]"
      - name: Lint
        run: ruff check pyRPHtools
      - name: Test
        run: pytest pyRPHtools -q
